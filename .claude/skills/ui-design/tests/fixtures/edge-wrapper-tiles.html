<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Wrapper tiles</title><style>body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#fff;color:#1f2933}.p{font:inherit;min-width:160px;padding:8px 16px;border-radius:6px;background:#1d4ed8;color:#fff;border:1px solid #1d4ed8}.o{font:inherit;padding:8px 16px;border-radius:6px;background:transparent;color:#1d4ed8;border:1px solid #1d4ed8}.ib{position:relative;width:44px;height:44px;padding:0;border:0;background:transparent;color:#1f2933;display:inline-flex;align-items:center;justify-content:center}main{padding:24px}ul.grid{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{display:block;border:1px solid #e4e7eb;border-radius:8px;padding:16px}</style></head><body><main><h1>Media</h1><ul class="grid"><li><a class="card" href="#a"><h3>One</h3></a></li><li><a class="card" href="#b"><h3>Two</h3><p>More text</p><p>Even more</p></a></li><li><a class="card" href="#c"><h3>Three</h3><p>Some</p></a></li></ul></main></body></html>
