<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand fills and a neutral tint</title>
<style>
  body { margin: 0; padding: 24px; font: 16px system-ui, sans-serif; background: #fff; color: #111; }
  .btn { display: inline-block; padding: 10px 16px; border-radius: 6px; border: 0; font: inherit; min-width: 120px; }
  .go { background: #22c55e; color: #fff; }
  .or { background: #f97316; color: #fff; }
  .warn { background: #ffc107; color: #000; }
  .tint { background: #f1f5f9; color: #111; border: 1px solid #e2e8f0; }
  .stack > div { margin-top: 24px; }
</style>
</head>
<body>
<h1>Your cart</h1>
<div class="stack">
  <div><button class="btn go">Place order</button></div>
  <div><button class="btn or">Buy now with 1-Click</button></div>
  <div><button class="btn warn">Add to cart</button></div>
  <div><button class="btn tint">Save draft</button></div>
</div>
</body>
</html>
