<!doctype html><html lang="en"><head><meta charset="utf-8"><title>App shell</title>
<style>body{margin:0;font:14px/1.5 system-ui,sans-serif;background:#fff;color:#1f2933}
#app{position:fixed;inset:0;display:grid;grid-template-rows:56px 1fr}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #e5e7eb}
.p{min-width:120px;height:36px;border-radius:6px;background:#1d4ed8;color:#fff;border:0;font:inherit}
.content{padding:24px;overflow:auto}</style></head>
<body><div id="app"><div class="top"><b>Invoices</b><div><button class="p">New invoice</button> <button class="p">Export all</button></div></div>
<div class="content"><h1>Invoices</h1><p>No invoices yet.</p></div></div></body></html>
