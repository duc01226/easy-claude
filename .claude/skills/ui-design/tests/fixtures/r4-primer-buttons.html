<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Primer buttons</title>
<style>body{margin:0;font:14px/1.5 system-ui,sans-serif;background:#f6f8fa;color:#1f2328}
main{max-width:900px;margin:32px auto;padding:0 16px}
.btn{min-width:120px;height:32px;padding:0 12px;border-radius:6px;font:inherit;font-weight:500;background:#fff;color:#24292f;border:1px solid #d0d7de}
.btn-primary{background:#1f883d;color:#fff;border-color:rgba(31,35,40,.15)}
.bar{display:flex;gap:8px;justify-content:flex-end}</style></head>
<body><main><h1>New repository</h1><p>A repository contains all project files.</p>
<div class="bar"><button class="btn">Import a repository</button><button class="btn btn-primary">Create repository</button></div></main></body></html>
