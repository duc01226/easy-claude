<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collection tiles of one height, different widths</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #fff; color: #1f2933; }
  main { padding: 24px; }
  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 16px; }
  li { height: 160px; box-sizing: border-box; border: 1px solid #e4e7eb; border-radius: 8px; padding: 16px; }
  li:nth-child(1) { width: 200px; }
  li:nth-child(2) { width: 320px; }
  li:nth-child(3) { width: 240px; }
  li a { color: #1d4ed8; }
</style>
</head>
<body>
  <main>
    <h1>Albums</h1>
    <ul>
      <li><a href="#a">Coast</a></li>
      <li><a href="#b">Mountains</a></li>
      <li><a href="#c">City</a></li>
    </ul>
  </main>
</body>
</html>
