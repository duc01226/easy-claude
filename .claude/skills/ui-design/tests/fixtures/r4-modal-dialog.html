<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Modal</title>
<style>body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#fff;color:#1f2933}
main{max-width:900px;margin:32px auto;padding:0 16px}
.p{min-width:140px;height:40px;border-radius:8px;background:#1d4ed8;color:#fff;border:0;font:inherit}
.d{min-width:140px;height:40px;border-radius:8px;background:#b91c1c;color:#fff;border:0;font:inherit}
.o{min-width:140px;height:40px;border-radius:8px;background:#fff;color:#1f2933;border:1px solid #cbd2d9;font:inherit}
dialog{border:0;border-radius:12px;padding:24px;width:420px}
dialog::backdrop{background:rgba(0,0,0,.4)}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}</style></head>
<body><main><h1>Files</h1><p>12 files</p><button class="p">Upload file</button></main>
<dialog id="confirm" aria-labelledby="ct"><h2 id="ct">Delete 3 files?</h2><p>This cannot be undone.</p>
<div class="foot"><button class="o">Cancel</button><button class="d">Delete</button><button class="d">Delete all</button></div></dialog>
<div role="dialog" aria-label="Cookie notice" style="position:fixed;bottom:16px;left:16px;right:16px;background:#fff;border:1px solid #e5e7eb;padding:16px;display:flex;gap:8px;align-items:center"><span>We use cookies.</span><button class="p">Accept all</button><button class="p">Reject all</button></div>
<script>document.getElementById('confirm').showModal();</script></body></html>
