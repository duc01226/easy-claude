<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Photo library</title>
<style>body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#fff;color:#1f2933}

ul.lib li{flex:1 1 260px;border:1px solid #d9dee5;border-radius:10px;padding:12px}

<body><main><h1>Library</h1><ul class="lib">
<li><div class="thumb" style="height:160px"></div><h3>Harbour at dawn</h3></li>
<li><div class="thumb" style="height:260px"></div><h3>Portrait, studio</h3></li>
<li><div class="thumb" style="height:160px"></div><h3>Market street</h3></li>
<li><div class="thumb" style="height:160px"></div><h3>Night bridge</h3></li>
<li><div class="thumb" style="height:160px"></div><h3>Old town</h3></li>
</ul></main></body></html>
