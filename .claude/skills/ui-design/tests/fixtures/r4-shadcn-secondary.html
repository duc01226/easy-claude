<!doctype html><html lang="en"><head><meta charset="utf-8"><title>shadcn dialog footer</title>
<style>:root{--background:0 0% 100%;--primary:222.2 47.4% 11.2%;--primary-foreground:210 40% 98%;--secondary:210 40% 96.1%;--secondary-foreground:222.2 47.4% 11.2%;--border:214.3 31.8% 91.4%}
body{margin:0;font:14px/1.5 system-ui,sans-serif;background:hsl(var(--background));color:hsl(var(--primary))}
main{max-width:640px;margin:48px auto;padding:24px;border:1px solid hsl(var(--border));border-radius:12px}
.inline-flex{display:inline-flex;align-items:center;justify-content:center;height:40px;min-width:120px;padding:0 16px;border-radius:6px;font:inherit;font-weight:500;border:0}
.bg-primary{background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
.bg-secondary{background:hsl(var(--secondary));color:hsl(var(--secondary-foreground))}
.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}</style></head>
<body><main><h2>Edit profile</h2><p>Make changes to your profile here. Click save when you're done.</p>
<label>Name <input value="Pedro Duarte"></label>
<div class="footer"><button class="inline-flex bg-secondary">Cancel</button><button class="inline-flex bg-primary">Save changes</button></div></main></body></html>
