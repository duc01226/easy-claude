<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Three equal cards with distinct commits</title>
<style>
  body { margin: 0; padding: 24px; font: 16px system-ui, sans-serif; background: #fff; color: #111; }
  .cols { display: flex; gap: 16px; }
  .cols > section { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
  .primary { background: #1d4ed8; color: #fff; border: 0; border-radius: 6px; padding: 10px 16px; font: inherit; }
</style>
</head>
<body>
<h1>Account settings</h1>
<div class="cols">
  <section><h2>Profile</h2><p>Name and photo.</p><div class="actions"><button class="primary">Save profile</button></div></section>
  <section><h2>Password</h2><p>Change password.</p><div class="actions"><button class="primary">Update password</button></div></section>
  <section><h2>Billing</h2><p>Invoices and plan.</p><div class="actions"><button class="primary">Save billing</button></div></section>
</div>
</body>
</html>
