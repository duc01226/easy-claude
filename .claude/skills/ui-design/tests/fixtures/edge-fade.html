<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Faded-out overlay</title>
<style>body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#fff;color:#1f2933}main{max-width:720px;margin:24px auto;padding:0 16px}
.primary{font:inherit;min-width:160px;padding:8px 16px;border-radius:6px;background:#1d4ed8;color:#fff;border:1px solid #1d4ed8}
.overlay{position:fixed;inset:0;opacity:0;pointer-events:none;background:#fff}</style>
</head><body><main><h1>Settings</h1><button class="primary">Save</button>
<div class="overlay"><div class="panel"><button class="primary">Confirm</button><button class="primary">Discard</button></div></div>
</main></body></html>
