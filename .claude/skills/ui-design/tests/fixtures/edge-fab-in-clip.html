<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App — a fixed action inside a clipped shell</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #fff; color: #111; }
  .app { height: 300px; overflow: hidden; position: relative; padding: 24px; }
  .fab { position: fixed; right: 24px; bottom: 24px; border-radius: 28px; background: #1d4ed8; color: #fff; border: 0; padding: 14px 20px; font: inherit; }
</style>
</head>
<body>
<div class="app">
  <h1>Inbox</h1>
  <p>No mail</p>
  <button class="fab">Compose</button>
</div>
</body>
</html>
