<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>sr-only icon buttons</title>
<style>body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#fff;color:#1f2933}main{max-width:720px;margin:24px auto;padding:0 16px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ib{width:20px;height:20px;padding:0;border:0;background:transparent;color:#e5e7eb}</style>
</head><body><main><h1>Files</h1>
<button class="ib"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span class="sr-only">Delete file</span></button>
</main></body></html>
