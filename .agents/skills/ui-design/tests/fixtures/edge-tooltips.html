<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tooltip variants</title>
<style>body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#fff;color:#1f2933}main{max-width:720px;margin:24px auto;padding:0 16px}
.ib{position:relative;width:44px;height:44px;padding:0;border:0;background:transparent;color:#1f2933}
.tip{position:absolute;top:-28px;left:0;visibility:hidden;background:#1f2933;color:#fff;padding:2px 6px}
#a:focus-visible + .tip{visibility:visible}
#c[data-tip]:focus::after{content:attr(data-tip);position:absolute;top:-28px;left:0;background:#1f2933;color:#fff;padding:2px 6px}</style>
</head><body><main><h1>Tools</h1>
<span style="position:relative;display:inline-block"><button class="ib" id="a" aria-label="Copy" aria-describedby="ta"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="5" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button><span class="tip" role="tooltip" id="ta">Copy</span></span>
<span style="position:relative;display:inline-block"><button class="ib" id="b" aria-label="Share" aria-describedby="tb"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="5" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button><span class="tip" role="tooltip" id="tb">Share</span></span>
<button class="ib" id="c" aria-label="Pin" data-tip="Pin"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="5" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
<script>
  document.getElementById('b').addEventListener('focus', () => setTimeout(() => { document.getElementById('tb').style.visibility = 'visible'; }, 300));
  document.getElementById('b').addEventListener('blur', () => { document.getElementById('tb').style.visibility = 'hidden'; });
</script>
</main></body></html>
