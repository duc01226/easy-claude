<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Autofill short</title><style>body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#fff;color:#1f2933}.p{font:inherit;min-width:160px;padding:8px 16px;border-radius:6px;background:#1d4ed8;color:#fff;border:1px solid #1d4ed8}.o{font:inherit;padding:8px 16px;border-radius:6px;background:transparent;color:#1d4ed8;border:1px solid #1d4ed8}.ib{position:relative;width:44px;height:44px;padding:0;border:0;background:transparent;color:#1f2933;display:inline-flex;align-items:center;justify-content:center}main{padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}.card{border:1px solid #e4e7eb;border-radius:8px;padding:16px;height:120px;box-sizing:border-box}</style></head><body><main><h1>Projects</h1><div class="grid"><div class="card"><h3>Alpha</h3></div><div class="card"><h3>Beta</h3></div><div class="card"><h3>Gamma</h3></div></div></main></body></html>
