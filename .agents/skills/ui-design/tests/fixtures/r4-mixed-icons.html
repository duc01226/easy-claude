<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mixed icon families</title>
<style>body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#fff;color:#1f2933}
main{max-width:720px;margin:48px auto;padding:0 16px}
.ib{width:44px;height:44px;padding:0;border:0;background:transparent;color:#1f2933}</style></head>
<body><main><h1>Toolbar</h1><div role="toolbar" aria-label="Formatting">
<button class="ib" aria-label="Undo" aria-describedby="t1"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8h9a4 4 0 0 1 0 8H8" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
<button class="ib" aria-label="Star"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2l2.4 5 5.6.8-4 3.9 1 5.6L10 14.6 5 17.3l1-5.6-4-3.9 5.6-.8z" fill="currentColor"/></svg></button>
<button class="ib" aria-label="Trash"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 6h10l-1 11H6zM3 6h14M8 3h4" fill="currentColor"/></svg></button>
</div></main></body></html>
