<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pricing</title>
<style>body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#fff;color:#1f2933}
main{max-width:1100px;margin:24px auto;padding:0 16px}
ul.plans{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:767px){ul.plans{grid-template-columns:1fr}}
.plan{border:1px solid #e4e7eb;border-radius:12px;padding:16px}
.plan h2{margin:0;font-size:18px}.price{font-size:28px;margin:4px 0}
.plan ul{padding-left:18px;margin:8px 0 16px;color:#52606d}
.cta{font:inherit;width:100%;min-height:44px;border-radius:8px;background:#1d4ed8;color:#fff;border:0}</style></head>
<body><main><h1>Simple pricing</h1><ul class="plans">
<li class="plan"><h2>Free</h2><p class="price">$0</p><ul><li>3 projects</li><li>Community support</li></ul><button class="cta">Start free</button></li>
<li class="plan"><h2>Team</h2><p class="price">$12</p><ul><li>Unlimited projects</li><li>Email support</li></ul><button class="cta">Choose Team</button></li>
<li class="plan"><h2>Business</h2><p class="price">$30</p><ul><li>SSO and audit log</li><li>Priority support</li></ul><button class="cta">Choose Business</button></li>
</ul></main></body></html>
