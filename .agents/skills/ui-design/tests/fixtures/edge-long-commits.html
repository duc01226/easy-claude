<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Long page, one commit per screenful</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #fff; color: #1f2933; }
  section { min-height: 900px; padding: 24px; box-sizing: border-box; }
  .p { font: inherit; min-width: 160px; padding: 8px 16px; border-radius: 6px; background: #1d4ed8; color: #fff; border: 1px solid #1d4ed8; }
</style>
</head>
<body>
  <main>
    <section><h2>Plan your trip</h2><p>Pick dates.</p><button class="p">Choose dates</button></section>
    <section><h2>Pick a room</h2><p>Compare rooms.</p><button class="p">Reserve room</button></section>
    <section><h2>Pay</h2><p>Card or transfer.</p><button class="p">Pay now</button></section>
  </main>
</body>
</html>
