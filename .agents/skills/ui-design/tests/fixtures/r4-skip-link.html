<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Skip link</title>
<style>body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#fff;color:#1f2933}main{max-width:720px;margin:32px auto;padding:0 16px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border-width:0}
.skip{background:#1d4ed8;color:#fff;padding:8px 12px;border-radius:6px}
.skip:focus{position:fixed;top:8px;left:8px;width:auto;height:auto;clip:auto;margin:0;overflow:visible}
.p{min-width:140px;height:40px;border-radius:8px;background:#1d4ed8;color:#fff;border:0;font:inherit}</style></head>
<body><a class="sr-only skip" href="#main">Skip to main content</a>
<main id="main"><h1>Account</h1><p>Your plan renews on 1 May.</p><button class="p">Upgrade plan</button></main></body></html>
