<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Grid header</title><style>body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#fff;color:#1f2933}.p{font:inherit;min-width:160px;padding:8px 16px;border-radius:6px;background:#1d4ed8;color:#fff;border:1px solid #1d4ed8}.o{font:inherit;padding:8px 16px;border-radius:6px;background:transparent;color:#1d4ed8;border:1px solid #1d4ed8}.ib{position:relative;width:44px;height:44px;padding:0;border:0;background:transparent;color:#1f2933;display:inline-flex;align-items:center;justify-content:center}main{padding:24px}[role=row]{display:flex;gap:24px}</style></head><body><main><h1>Users</h1><div role="grid"><div role="row"><span role="columnheader">Name <button class="ib" aria-label="Sort by name"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="5" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button></span><span role="columnheader">Role <button class="ib" aria-label="Sort by role"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="5" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button></span><span role="columnheader">Seen <button class="ib" aria-label="Sort by seen"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="5" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button></span></div><div role="row"><span role="gridcell">Jane</span><span role="gridcell">Admin</span><span role="gridcell">Today</span></div></div></main></body></html>
