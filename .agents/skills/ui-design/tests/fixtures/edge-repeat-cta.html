<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The same call to action in header and hero</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #fff; color: #1f2933; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; }
  main { padding: 24px; }
  .p { font: inherit; min-width: 160px; padding: 8px 16px; border-radius: 6px; background: #1d4ed8; color: #fff; border: 1px solid #1d4ed8; }
</style>
</head>
<body>
  <header><b>Brand</b><button class="p">Start free</button></header>
  <main><h1>Ship faster</h1><p>Short pitch.</p><button class="p">Start free</button></main>
</body>
</html>
