<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings — two equal cards, two commits</title>
<style>
  body { margin: 0; padding: 24px; font: 16px system-ui, sans-serif; background: #fff; color: #111; }
  .btn { display: inline-block; padding: 10px 16px; border-radius: 6px; border: 0; font: inherit; min-width: 120px; }
  .primary { background: #1d4ed8; color: #fff; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; background: #fff; }
  .cols { display: flex; gap: 24px; }
  .cols > section { flex: 1; }
</style>
</head>
<body>
<h1>Account settings</h1>
<div class="cols">
  <section class="card"><h2>Profile</h2><p>Name and photo.</p><p style="text-align:right"><button class="btn primary">Save profile</button></p></section>
  <section class="card"><h2>Password</h2><p>Change your password.</p><p style="text-align:right"><button class="btn primary">Update password</button></p></section>
</div>
</body>
</html>
