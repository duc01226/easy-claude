<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stacked sections and cards are not list rows</title>
<style>
  body { margin: 0; padding: 24px; font: 16px system-ui, sans-serif; background: #fff; color: #111; }
  section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .outline { background: #fff; border: 1px solid #888; color: #111; padding: 8px 14px; border-radius: 6px; font: inherit; }
</style>
</head>
<body>
<h1>Features</h1>
<section class="feat"><h2>Fast</h2><p>Short copy.</p><p><button class="outline">Learn more</button></p></section>
<section class="feat"><h2>Clear</h2><p>Short copy.</p><p><button class="outline">Learn more</button></p></section>
<section class="feat"><h2>Private</h2><p>Short copy.</p><p><button class="outline">Learn more</button></p></section>
<section class="card"><h2>Profile</h2><p>Your details.</p><p><button class="outline">Save</button></p></section>
<section class="card"><h2>Password</h2><p>Your password.</p><p><button class="outline">Save</button></p></section>
<section class="card"><h2>Billing</h2><p>Your billing.</p><p><button class="outline">Save</button></p></section>
</body>
</html>
