<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Grid shell</title><style>body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#fff;color:#1f2933}.p{font:inherit;min-width:160px;padding:8px 16px;border-radius:6px;background:#1d4ed8;color:#fff;border:1px solid #1d4ed8}.o{font:inherit;padding:8px 16px;border-radius:6px;background:transparent;color:#1d4ed8;border:1px solid #1d4ed8}.ib{position:relative;width:44px;height:44px;padding:0;border:0;background:transparent;color:#1f2933;display:inline-flex;align-items:center;justify-content:center}main{display:grid;grid-template-columns:2fr 1fr;gap:24px;padding:24px}</style></head><body><main><section><h1>Edit post</h1><textarea></textarea><div><button class="p">Save</button></div></section><aside><h2>Publish</h2><div><button class="p">Publish</button></div></aside></main></body></html>
