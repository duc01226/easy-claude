<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ragged column across rows</title>
<style>body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#fff;color:#1f2933}main{max-width:720px;margin:24px auto;padding:0 16px}
table{width:100%}td{padding:8px}.out{font:inherit;padding:6px 12px;border-radius:6px;background:transparent;color:#1d4ed8;border:1px solid #1d4ed8}
.wrap .out{margin:4px}</style>
</head><body><main><h1>Requests</h1>
<table><tbody>
<tr><td>Request A</td><td><button class="out">Approve</button></td></tr>
<tr><td>Request B</td><td><button class="out">Request changes from owner</button></td></tr>
<tr><td>Request C</td><td><button class="out">Ok</button></td></tr>
</tbody></table>
<div class="wrap"><form><button class="out">Export</button></form><form><button class="out">Download everything as archive</button></form></div>
</main></body></html>
