**Anti-Rationalization:**

| Evasion                                     | Rebuttal                                                                                        |
| ------------------------------------------- | ----------------------------------------------------------------------------------------------- |
| "One strong source is enough"               | NEVER cite a single source as authoritative — every factual claim needs 2+ independent sources. |
