> 1. **EDIT SOURCE, NEVER MIRRORS.** `.claude/**` + root `CLAUDE.md` are the ONLY hand-editable surfaces. `.agents/`, `.codex/`, `AGENTS.md` are GENERATED — the next sync overwrites any direct edit. If asked to change a mirror, change its source and re-sync.
> 2. **SYNC PROTOCOLS FOLLOW THE HYBRID POLICY.** Shared protocols are authored once in `.claude/skills/shared/sync-inline-versions.md`; every other copy is a projection (`SYNC:shared-protocol-duplication-policy`). Converted skills carry one guide line per protocol and a hook delivers the full text from `.claude/skills/shared/protocols/`; the five review-family skills, `references/*.md` bodies, agents and reviewer prompts keep the verbatim body between paired `SYNC:{tag}` HTML-comment fences. To change one: edit the canonical, then propagate (`sync-update-blocks.py <tag>` via the `sync-skills-shared-protocols` skill), rebuild the projection (`node .claude/scripts/build-protocol-projection.cjs`) and grep `SYNC:{tag}` for copies outside the tool's scope. NEVER hand-extract, deduplicate or replace a body outside those rules — a reader with no hook and no body loses the rule.
